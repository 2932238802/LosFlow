<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLOW</title>
<style>
  :root{
    --bg:#080808; --fg:#eaeaea; --muted:#8f8f8f; --dim:#585858; --ghost:#262626; --line:#1c1c1c;
    --mono:"JetBrains Mono","Cascadia Code","SFMono-Regular",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fcfcfc; --fg:#141414; --muted:#6d6d6d; --dim:#a8a8a8; --ghost:#dadada; --line:#eeeeee; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{font-family:var(--sans);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:56px 36px 120px}
  @media (max-width:720px){ .wrap{padding:32px 18px 80px} }

  header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  h1{margin:0;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.34em;text-transform:uppercase}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--fg);animation:br 3.6s ease-in-out infinite}
  .dot.hold{animation:none;opacity:.9}
  @keyframes br{0%,100%{opacity:.25}50%{opacity:1}}
  .state{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .sp{flex:1}
  .clock{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em}

  /* stage */
  .stage{font-size:12.5px;color:var(--dim);margin-bottom:6px}
  .stage .now{color:var(--fg)}
  .stage .sep{margin:0 10px;color:var(--ghost)}

  .msg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--fg);min-height:18px;margin-top:6px}
  .msg.err{color:var(--fg);text-decoration:underline}

  section{margin-top:44px}
  .hd{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
      margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
  .hd b{font-weight:400;color:var(--muted)}

  /* auth */
  .cmds{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:2}
  code{font-family:var(--mono);font-size:10.5px;background:transparent;border:1px solid var(--line);
       padding:1px 6px;border-radius:1px;color:var(--muted);margin-right:6px}

  /* pool */
  .item{border-top:1px solid var(--line);padding:18px 0}
  .item:first-of-type{border-top:0}
  .t{font-size:14.5px}
  .n{color:var(--dim);font-size:12px;margin-top:2px}
  .bar{display:flex;align-items:center;gap:18px;margin-top:12px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
        color:var(--dim);cursor:pointer;user-select:none;border-bottom:1px solid transparent;padding-bottom:1px}
  .chip.on{color:var(--fg);border-bottom-color:var(--fg)}
  .chip:hover{color:var(--muted)}
  .acts{margin-left:auto;display:flex;gap:16px}
  .btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
       background:none;border:0;color:var(--muted);cursor:pointer;padding:0}
  .btn:hover{color:var(--fg)}
  .btn:disabled{color:var(--ghost);cursor:not-allowed}
  .btn.danger:hover{text-decoration:line-through}

  textarea, input[type=text]{width:100%;background:transparent;border:1px solid var(--line);color:var(--fg);
    font-family:var(--sans);font-size:13px;padding:10px 12px;border-radius:2px;outline:none;resize:vertical}
  textarea:focus, input:focus{border-color:var(--ghost)}
  .edit{margin-top:12px}
  .edit .hint{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
  .edit .row2{display:flex;gap:14px;margin-top:10px;justify-content:flex-end}

  .add{display:flex;gap:12px;margin-top:18px}
  .add input{flex:1}

  /* tasks */
  .task{display:grid;grid-template-columns:30px 72px 62px 1fr;gap:12px;padding:11px 0;
        border-top:1px solid var(--line);align-items:baseline;font-size:12.5px}
  .task:first-of-type{border-top:0}
  .task .id,.task .own,.task .st{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim)}
  .task .st.doing{color:var(--fg)}
  .task .subj{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .subj em{font-style:normal;color:var(--dim)}

  /* activity */
  .act .row{display:grid;grid-template-columns:44px 34px 1fr;gap:12px;padding:9px 0;
            border-top:1px solid var(--line);font-size:12px;align-items:baseline}
  .act .row:first-child{border-top:0}
  .act time,.act .who{font-family:var(--mono);font-size:10px;color:var(--dim)}
  .act .what{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .empty{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ghost);padding:6px 0}
  footer{margin-top:64px;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;
         display:flex;gap:20px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="dot" id="dot"></span>
    <h1>Flow</h1>
    <span class="state" id="state">—</span>
    <span class="sp"></span>
    <span class="clock" id="clock"></span>
  </header>
  <div class="stage" id="stage"></div>
  <div class="msg" id="msg"></div>

  <section id="authSection" hidden>
    <div class="hd">Authorize <b id="authCount"></b></div>
    <div id="auth"></div>
  </section>

  <section>
    <div class="hd">Pool <b id="poolCount"></b></div>
    <div id="pool"></div>
    <div class="add">
      <input type="text" id="newTitle" placeholder="新任务：一句话说清要做什么">
      <button class="btn" id="addBtn">加入</button>
    </div>
  </section>

  <section>
    <div class="hd">Tasks <b id="taskCount"></b></div>
    <div id="tasks"></div>
    <div class="empty" id="taskEmpty" hidden>NO TASKS</div>
  </section>

  <section>
    <div class="hd">Activity</div>
    <div class="act" id="activity"></div>
  </section>

  <footer>
    <span>SPEND <span id="spend">0.000</span> USD</span>
    <span>AUTO 5S</span>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STAGES = ["基线","需求","任务表","文档","确认","开发","Review","验收","收尾"];
let editingId = null;

async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"content-type":"application/json","x-dash":"1"}, body:JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({error:"bad response"}));
  if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
  return j.result;
}
function flash(text, isErr){
  const m = $("msg");
  m.textContent = text || "";
  m.className = "msg" + (isErr ? " err" : "");
  clearTimeout(flash._t);
  flash._t = setTimeout(()=>{ m.textContent=""; }, isErr ? 6000 : 3000);
}

function renderStage(stage){
  $("stage").innerHTML = stage===null ? `<span class="now">等你拍板</span>` :
    STAGES.map((n,i)=>`<span class="${i===stage?"now":""}">${n}</span>`).join('<span class="sep">/</span>');
}

function renderApprovals(items){
  const pending = (items || []).filter(a => a.status === "pending");
  $("authSection").hidden = pending.length === 0;
  $("authCount").textContent = pending.length || "";
  $("auth").innerHTML = pending.map(a=>`
    <div class="item">
      <div class="t">Claude Code 想执行：</div>
      <div class="cmds">${(a.commands||[]).map(c=>`<code>${esc(c)}</code>`).join("")}</div>
      <div class="n">建议放行 ${(a.suggested||[]).map(r=>`<code>${esc(r)}</code>`).join(" ") || "—"} · 来自任务 ${esc(a.dispatch||"")}</div>
      <div class="bar">
        <span class="n">批准后会自动按原任务重派一次</span>
        <span class="acts">
          <button class="btn" data-act="approve" data-id="${esc(a.id)}">批准</button>
          <button class="btn danger" data-act="reject" data-id="${esc(a.id)}">拒绝</button>
        </span>
      </div>
    </div>`).join("");
}

function renderPool(items){
  $("poolCount").textContent = items.length ? items.length : "";
  if (!items.length){
    $("pool").innerHTML = `<div class="empty">POOL EMPTY · 把要做的事加到下面</div>`;
    return;
  }
  $("pool").innerHTML = items.map(it=>{
    const c = it.confirm || {};
    const ready = c.detail && c.flow && c.auth;
    const editing = editingId === it.id;
    const kids = (it.children||[]).length;
    const state = it.stage === "pushed" ? `已推送 → 任务 #${it.pushTaskId}` :
                  it.stage === "split" ? `已拆分 ${kids} 条` : "未拆";
    return `<div class="item" data-id="${esc(it.id)}">
      <div class="t">${esc(it.title)}</div>
      <div class="n">${esc(it.note || "")}${it.note ? " · " : ""}${esc(state)}</div>
      <div class="bar">
        <span class="chip ${c.detail?"on":""}" data-act="toggle" data-id="${esc(it.id)}" data-f="detail">细则</span>
        <span class="chip ${c.flow?"on":""}" data-act="toggle" data-id="${esc(it.id)}" data-f="flow">流程</span>
        <span class="chip ${c.auth?"on":""}" data-act="toggle" data-id="${esc(it.id)}" data-f="auth">授权</span>
        <span class="acts">
          <button class="btn" data-act="split" data-id="${esc(it.id)}" ${c.detail?"":"disabled"}>拆分</button>
          <button class="btn" data-act="push" data-id="${esc(it.id)}" ${(ready && kids && !it.pushTaskId)?"":"disabled"}>推送</button>
          <button class="btn danger" data-act="remove" data-id="${esc(it.id)}">×</button>
        </span>
      </div>
      ${editing ? `<div class="edit">
        <div class="hint">一行一条；前缀 cc: 给 Claude Code，wb: 给 WorkBuddy；不写默认 cc</div>
        <textarea id="subs" rows="4" placeholder="cc: 改跳题逻辑&#10;wb: 把这一行写进腾讯文档"></textarea>
        <div class="row2">
          <button class="btn" data-act="cancel">取消</button>
          <button class="btn" data-act="save" data-id="${esc(it.id)}">保存</button>
        </div>
      </div>` : ""}
    </div>`;
  }).join("");
}

function renderTasks(tasks){
  $("taskCount").textContent = tasks.length || "";
  $("taskEmpty").hidden = tasks.length > 0;
  $("tasks").innerHTML = tasks.map(t=>`
    <div class="task">
      <span class="id">${esc(t.id)}</span>
      <span class="own">${esc(t.owner)}</span>
      <span class="st ${esc(t.status)}">${esc(t.status)}</span>
      <span class="subj" title="${esc(t.evidence)}">${esc(t.subject)}${t.evidence?` <em>· ${esc(t.evidence.slice(0,50))}</em>`:""}</span>
    </div>`).join("");
}

function renderActivity(calls, dispatches){
  const items = [
    ...calls.map(c=>({at:c.at, who:"WB", text:`${c.tool}${c.ok?"":" · failed"}`})),
    ...dispatches.map(d=>({at:d.at, who:"CC", text:`${d.status}${d.cost!=null?" · $"+Number(d.cost).toFixed(3):""}${d.resumed?" · resume":""}`})),
  ].sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,6);
  $("activity").innerHTML = items.map(x=>`
    <div class="row"><time>${esc((x.at||"").slice(11,16))}</time><span class="who">${x.who}</span><span class="what">${esc(x.text)}</span></div>`).join("")
    || `<div class="empty">—</div>`;
}

async function refresh(){
  try{
    const s = await (await fetch("/api/state",{cache:"no-store"})).json();
    const hold = s.progress.status==="waiting" || s.progress.status==="blocked";
    $("dot").className = "dot" + (hold ? " hold" : "");
    $("state").textContent = hold ? "Hold" : s.progress.status==="done" ? "Closed" : "Running";
    $("clock").textContent = new Date().toTimeString().slice(0,8);
    $("spend").textContent = Number(s.spendToday||0).toFixed(3);
    renderStage(s.stage);
    renderApprovals(s.approvals || []);
    renderPool(s.pool || []);
    renderTasks(s.tasks || []);
    renderActivity(s.calls || [], s.dispatches || []);
  }catch(e){
    $("clock").textContent = "offline";
  }
}

document.addEventListener("click", async (ev)=>{
  const el = ev.target.closest("[data-act]");
  const act = el?.dataset.act;
  if (!act) {
    if (ev.target.id === "addBtn") return addTask();
    if (ev.target.id === "cancel") return refresh();
    return;
  }
  const id = el.dataset.id;
  try{
    if (act === "toggle"){ await post("/api/pool/toggle", {id, field: el.dataset.f}); refresh(); }
    else if (act === "split"){ editingId = id; refresh(); setTimeout(()=>document.getElementById("subs")?.focus(), 30); }
    else if (act === "cancel"){ editingId = null; refresh(); }
    else if (act === "save"){
      const raw = document.getElementById("subs").value.trim();
      if (!raw) return flash("至少写一条子任务", true);
      const subs = raw.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
        const m = l.match(/^(cc|wb)\s*[:：]\s*(.+)$/i);
        if (m) return {owner: m[1].toLowerCase()==="wb" ? "workbuddy" : "claude-code", title: m[2]};
        return {title: l};
      });
      const r = await post("/api/pool/split", {id, subs});
      editingId = null;
      flash(`已拆出 ${r.created.length} 条子任务`);
      refresh();
    }
    else if (act === "push"){
      const r = await post("/api/pool/push", {id});
      flash(`已推送：任务 #${r.task.id} 交给 WorkBuddy 写文档`);
      refresh();
    }
    else if (act === "remove"){ await post("/api/pool/remove", {id}); refresh(); }
    else if (act === "approve"){
      const r = await post("/api/approve", {id});
      flash(`已批准：${(r.rules||[]).join(" ")} · ${(r.retry&&r.retry.note)||""}`);
      refresh();
    }
    else if (act === "reject"){ await post("/api/reject", {id}); flash("已拒绝"); refresh(); }
  }catch(err){ flash(err.message, true); }
});

async function addTask(){
  const t = $("newTitle").value.trim();
  if (!t) return;
  try{
    await post("/api/pool/add", {title: t});
    $("newTitle").value = "";
    flash("已加入任务池");
    refresh();
  }catch(e){ flash(e.message, true); }
}
$("newTitle").addEventListener("keydown", e=>{ if (e.key==="Enter") addTask(); });

refresh();
setInterval(()=>{
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) return; // 别打断输入
  if (editingId) return;
  refresh();
}, 5000);
</script>
</body>
</html>
